<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="轉環 Zhuanhuan：罡曜 GambitAura 的第二款原創棋。轉動圓環或移動棋子，讓三枚棋子連成一線。" />
<meta name="theme-color" content="#08090c" />
<title>轉環 Zhuanhuan · 罡曜 GambitAura</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Instrument+Sans:wght@400..700&family=Noto+Serif+TC:wght@500;700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/ga.css" />
<link rel="stylesheet" href="../assets/game.css" />
<style>
  /* 轉環 only. Three rings of light around a core; pieces ride the rings. Geometry is in board
     units of 1/600 of the board width (cqw / 6), centred on the board. */
  .board.zh { container-type: inline-size; }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; overflow: visible; }
  .art .spoke { stroke: rgba(236, 230, 218, .07); stroke-width: 1; }
  .art .lbl { font-family: var(--display); font-style: italic; font-size: 19px; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
  /* with transform-box: view-box, 0 0 is the viewBox origin, which is the board's centre here */
  .art .ring { transform-box: view-box; transform-origin: 0 0; transition: transform .8s cubic-bezier(.3, .7, .2, 1); }
  .art .track { fill: none; stroke: rgba(217, 195, 143, .26); stroke-width: 1.2; transition: stroke .5s, stroke-width .5s, filter .5s; }
  .art .band { fill: none; stroke: rgba(217, 195, 143, 0); stroke-width: 34; transition: stroke .5s; }
  .art .ring.hot .track, .art .ring.last .track { stroke: rgba(217, 195, 143, .75); stroke-width: 1.6; filter: drop-shadow(0 0 6px rgba(217, 195, 143, .7)); }
  .art .ring.hot .band { stroke: rgba(217, 195, 143, .045); }
  .art .sock { fill: #07080b; stroke: rgba(236, 230, 218, .07); stroke-width: 1; }
  .art .core-ring { transform-box: view-box; transform-origin: 0 0; animation: coreSpin 90s linear infinite; }
  @keyframes coreSpin { to { transform: rotate(360deg); } }
  .art .core { animation: coreBreathe 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes coreBreathe { 50% { opacity: .7; transform: scale(.92); } }
  .art .thread { fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(217, 195, 143, .9)); stroke-dasharray: 600; stroke-dashoffset: 600; transition: stroke-dashoffset 1.1s ease .3s; }
  .art .thread.on { stroke-dashoffset: 0; }

  /* everything placed on a spot: rotate to the spoke, out to the ring, rotate back upright */
  .spot { position: absolute; left: 50%; top: 50%; width: 9.4%; height: 9.4%; margin: -4.7% 0 0 -4.7%;
    transform: rotate(calc(var(--a) * 1deg)) translateY(calc(var(--rad) * -1cqw / 6)) rotate(calc(var(--a) * -1deg)); }
  #pieces { z-index: 4; } #marks { z-index: 5; } #cells { z-index: 6; }
  .pc { transition: transform .8s cubic-bezier(.3, .7, .2, 1); pointer-events: none; }
  .pc b { position: absolute; inset: 4%; border-radius: 50%; transition: box-shadow .6s, filter .6s, opacity .6s; }
  .pc b::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 34% 26%, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 30%); }
  .pc.mint b {
    background: radial-gradient(circle at 50% 60%, #d4f1e7 0%, #9bd9c5 30%, #5fae98 68%, #2f6a5b 100%);
    box-shadow: inset 0 -5px 10px rgba(10, 40, 32, .45), inset 0 2px 2px rgba(255, 255, 255, .3), 0 12px 20px -8px rgba(0, 0, 0, .85), 0 0 26px -6px var(--mint-glow);
  }
  .pc.coral b {
    background: radial-gradient(circle at 50% 60%, #f8dbd0 0%, #efab95 30%, #c46d55 68%, #79382a 100%);
    box-shadow: inset 0 -5px 10px rgba(50, 15, 8, .45), inset 0 2px 2px rgba(255, 255, 255, .3), 0 12px 20px -8px rgba(0, 0, 0, .85), 0 0 26px -6px var(--coral-glow);
  }
  .board.turn-0:not(.over) .pc.mint b, .board.turn-1:not(.over) .pc.coral b { animation: alive 4.5s ease-in-out infinite; }
  @keyframes alive { 50% { filter: brightness(1.12); } }
  .pc::before, .pc::after { content: ''; position: absolute; inset: -6%; border-radius: 50%; border: 1px solid var(--gold); opacity: 0; pointer-events: none; }
  .pc.sel::before { opacity: .9; box-shadow: 0 0 14px var(--gold-glow), inset 0 0 10px rgba(217, 195, 143, .2); }
  .pc.sel::after { animation: ripple 2.2s ease-out infinite; }
  .pc.last::before { opacity: .45; }
  .board.over .pc:not(.won) b { opacity: .45; filter: saturate(.6); }
  .pc.won b { animation: none; filter: brightness(1.15); box-shadow: inset 0 -5px 10px rgba(0, 0, 0, .3), 0 0 40px 8px var(--gold-glow), 0 0 90px 20px rgba(217, 195, 143, .18); }
  .mark { display: grid; place-items: center; }
  .mark.step::before { content: ''; width: 30%; height: 30%; border-radius: 50%; background: rgba(217, 195, 143, .55); box-shadow: 0 0 12px rgba(217, 195, 143, .5); }
  .mark.from::before { content: ''; width: 46%; height: 46%; border-radius: 50%; border: 1px dashed rgba(217, 195, 143, .45); }
  .cellbtn { position: absolute; border-radius: 50%; }
  .cellbtn.act:hover { background: rgba(236, 230, 218, .06); }
  .cellbtn:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }

  /* Turning a ring: one row of controls under the board */
  .turnbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tg { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 6px; border-top: 1px solid var(--edge); transition: border-color .4s; }
  .tg.hot { border-top-color: rgba(217, 195, 143, .6); }
  .tg .ic { width: 22px; height: 22px; flex: none; }
  .tg .ic circle { fill: none; stroke: rgba(236, 230, 218, .22); stroke-width: 1.2; }
  .tg .ic circle.on { stroke: var(--gold); stroke-width: 1.8; }
  .tg .nm { font-size: .82rem; color: var(--muted); letter-spacing: .06em; min-width: 2.2em; }
  .tb { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--edge-hi); background: transparent; color: var(--ink); font-size: 1.15rem; line-height: 1; cursor: pointer; transition: border-color .3s, color .3s, background .3s, opacity .3s; }
  .tb:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); background: rgba(217, 195, 143, .06); }
  .tb:disabled { opacity: .22; cursor: default; }
  .tb .tag { position: absolute; right: -6px; top: -6px; min-width: 1.5em; height: 1.5em; padding: 0 .25em; border-radius: 999px; display: grid; place-items: center;
    font-family: var(--cjk); font-size: .66rem; font-weight: 700; color: var(--gold); background: rgba(8, 9, 12, .92); border: 1px solid rgba(217, 195, 143, .6); }
  @media (max-width: 520px) {
    .turnbar { gap: 4px; }
    .tg { gap: 5px; padding: 8px 2px; }
    .tg .ic { display: none; }
    .tb { width: 36px; height: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pc, .art .ring { transition: none; }
    .art .core-ring, .art .core { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="ga-top">
    <a class="ga-brand" href="../" aria-label="罡曜 GambitAura">
      <svg viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="gaCore" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#ecdcb4"/><stop offset="1" stop-color="#c9ad74"/></radialGradient><radialGradient id="gaHalo" cx=".5" cy=".5" r=".5"><stop offset=".3" stop-color="#d9c38f" stop-opacity=".28"/><stop offset="1" stop-color="#d9c38f" stop-opacity="0"/></radialGradient></defs><circle cx="32" cy="32" r="30" fill="url(#gaHalo)"/><circle cx="32" cy="32" r="22" fill="none" stroke="#d9c38f" stroke-width="1.4" opacity=".7"/><circle cx="32" cy="32" r="15" fill="none" stroke="#d9c38f" stroke-width="1" stroke-dasharray="1.5 3.5" opacity=".6"/><circle cx="32" cy="32" r="7" fill="url(#gaCore)"/></svg>
      <span class="ga-lock" aria-hidden="true"><span class="ga-zh">罡曜</span><span class="ga-word">Gambit<b>Aura</b></span></span>
      <span class="ga-crumb">· Game 02</span>
    </a>
    <div class="ga-langs" role="group" aria-label="Language">
      <button class="ga-chip" data-lang="zh" aria-pressed="true">中文</button>
      <button class="ga-chip" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main class="game">
    <section class="stage">
      <div class="col title-row">
        <div class="title"><h1>轉環</h1><span class="latin">Zhuanhuan</span></div>
        <span class="opening-tag" id="tag"></span>
      </div>

      <div class="col ga-card score" id="score">
        <div class="side-box mint" id="sbMint"><span class="orb"></span><span class="who" id="whoMint"></span><span class="pts" id="ptsMint">0</span></div>
        <div class="round" id="round"></div>
        <div class="side-box coral" id="sbCoral"><span class="orb"></span><span class="who" id="whoCoral"></span><span class="pts" id="ptsCoral">0</span></div>
      </div>

      <div class="col">
        <div class="board zh" id="board">
          <div class="mist mist-0" aria-hidden="true"></div>
          <div class="mist mist-1" aria-hidden="true"></div>
          <svg class="art" id="art" viewBox="-300 -300 600 600" aria-hidden="true">
            <defs>
              <radialGradient id="zCore" cx=".5" cy=".45" r=".55"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#ecdcb4"/><stop offset="1" stop-color="#c9ad74"/></radialGradient>
              <radialGradient id="zHalo" cx=".5" cy=".5" r=".5"><stop offset=".25" stop-color="#d9c38f" stop-opacity=".3"/><stop offset="1" stop-color="#d9c38f" stop-opacity="0"/></radialGradient>
            </defs>
            <g id="spokes"></g>
            <circle r="70" fill="url(#zHalo)"/>
            <g class="core-ring"><circle r="40" fill="none" stroke="#d9c38f" stroke-width="1" stroke-dasharray="1.5 6" opacity=".55"/></g>
            <circle class="core" r="13" fill="url(#zCore)"/>
            <g id="rings"></g>
            <path class="thread" id="thread" d=""/>
          </svg>
          <div class="layer" id="pieces" aria-hidden="true"></div>
          <div class="layer" id="marks" aria-hidden="true"></div>
          <div class="layer" id="cells" role="group" aria-label="board"></div>
          <div class="overlay" id="overlay" aria-live="polite">
            <div>
              <div class="big" id="ovBig"></div>
              <div class="small" id="ovSmall"></div>
              <div class="btns">
                <button class="ga-btn primary" id="ovNext"></button>
                <button class="ga-btn" id="ovLook"></button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col turnbar" id="turnbar" role="group" aria-label="turn a ring"></div>

      <div class="col ga-card status" id="status" aria-live="polite">
        <span class="msg" id="msg"></span>
        <span class="ply" id="ply"></span>
        <span class="sub" id="sub"></span>
      </div>
    </section>

    <aside class="panel">
      <div class="ga-card">
        <span class="ga-label" data-i18n="setup">Setup</span>
        <div class="row"><span data-i18n="mode">Mode</span>
          <div class="ga-seg" id="modeSeg">
            <button data-v="ai" data-i18n="modeAi">vs computer</button>
            <button data-v="pvp" data-i18n="modePvp">Two players</button>
          </div>
        </div>
        <div class="row" id="levelRow"><span data-i18n="level">Computer</span>
          <div class="ga-seg" id="levelSeg">
            <button data-v="easy" data-i18n="easy">Easy</button>
            <button data-v="normal" data-i18n="normal">Normal</button>
            <button data-v="hard" data-i18n="hard">Hard</button>
          </div>
        </div>
        <p class="note" id="note"></p>
        <div class="btns">
          <button class="ga-btn" id="restartBtn" data-i18n="restart">Restart</button>
          <button class="ga-btn primary" id="nextBtn" data-i18n="next" hidden>Next game</button>
        </div>
      </div>

      <div class="ga-card">
        <span class="ga-label" data-i18n="moves">Moves</span>
        <ol class="log" id="log"></ol>
        <p class="empty" id="logEmpty" data-i18n="noMoves">No moves yet.</p>
      </div>

      <div class="ga-card">
        <details class="rules" id="rules">
          <summary data-i18n="rulesTitle">How to play</summary>
          <div id="rulesBody"></div>
        </details>
      </div>
    </aside>
  </main>

  <footer class="ga-foot">
    <span data-i18n="footer1">No dice, no timer, nothing hidden.</span>
    <a href="analysis/" data-i18n="footer2">How we checked fairness</a>
    <a href="../" data-i18n="footer3">All games</a>
  </footer>
</div>

<dialog id="drawDlg">
  <p id="drawText"></p>
  <div class="btns">
    <button class="ga-btn" id="drawCancel"></button>
    <button class="ga-btn primary" id="drawOk"></button>
  </div>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
